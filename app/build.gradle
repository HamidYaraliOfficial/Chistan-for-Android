
plugins {
    id 'com.android.application'
}

// Release signing configuration
def releaseKeystore = System.getenv('CHISTAN_KEYSTORE_FILE')

android {
    namespace 'app.chistan.crossword'
    compileSdk 34

    defaultConfig {
        applicationId 'app.chistan.crossword'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('CHISTAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHISTAN_KEY_ALIAS')
                keyPassword System.getenv('CHISTAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            if (releaseKeystore) {
                signingConfig signingConfigs.release
            } else if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                // Cafe Bazaar rejects debug-signed APKs, so never fall back to the debug key.
                throw new GradleException(
                    "Release signing key not configured. Set CHISTAN_KEYSTORE_FILE and signing credentials."
                )
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No external dependencies.
// The app uses Android Activity and WebView only.
